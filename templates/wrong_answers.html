<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题库 - 小学生学习平台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/wrong_answers.css') }}">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>📝 错题库</h1>
            <div class="header-actions">
                <button class="back-btn" onclick="window.location.href='/english/practice'">← 返回单词练习</button>
                <button class="back-btn" onclick="window.location.href='/english/vocabulary'">← 返回单词学习</button>
                <button class="back-btn" onclick="window.location.href='/'">← 返回首页</button>
            </div>
        </header>

        <!-- 筛选条件 -->
        <div class="filter-bar">
            <div class="filter-group">
                <label>教材：</label>
                <select id="textbookFilter" class="filter-select">
                    <option value="">全部</option>
                </select>
            </div>
            <div class="filter-group">
                <label>练习模式：</label>
                <select id="modeFilter" class="filter-select">
                    <option value="">全部</option>
                    <option value="chinese_to_english">中文→英文</option>
                    <option value="english_to_chinese">英文→中文</option>
                </select>
            </div>
            <button class="filter-btn" onclick="loadWrongAnswers()">筛选</button>
            <button class="clear-btn" onclick="clearAllWrongAnswers()">清空错题库</button>
        </div>

        <!-- 统计信息 -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">错题总数</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">错误次数</span>
                <span class="stat-value" id="totalErrors">0</span>
            </div>
        </div>

        <!-- 错题列表 -->
        <div class="wrong-answers-container">
            <!-- 导航指示 -->
            <div class="wrong-answer-nav" id="wrongAnswerNav" style="display: none;">
                <span id="currentIndex">1</span> / <span id="totalCount">0</span>
            </div>
            
            <!-- 错题卡片容器 -->
            <div class="wrong-answer-card-container" id="wrongAnswerCardContainer">
                <div id="wrongAnswersList" class="wrong-answers-list">
                    <!-- 错题卡片将通过JavaScript动态加载 -->
                </div>
            </div>
            
            <!-- 导航按钮 -->
            <div class="wrong-answer-controls" id="wrongAnswerControls" style="display: none;">
                <button class="nav-btn prev-nav-btn" id="prevNavBtn" onclick="showPreviousWrongAnswer()">← 上一个</button>
                <button class="nav-btn next-nav-btn" id="nextNavBtn" onclick="showNextWrongAnswer()">下一个 →</button>
            </div>
            
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📚</div>
                <div class="empty-text">暂无错题</div>
                <div class="empty-hint">答错的题目会自动保存到这里</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/wrong_answers.js') }}"></script>
</body>
</html>
