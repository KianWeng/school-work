<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语阅读 - 小鱼快学</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/english_reading.css') }}">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>📚 英语阅读</h1>
            <div class="header-actions">
                <button class="back-btn" onclick="window.location.href='/'">← 返回首页</button>
            </div>
        </header>

        <!-- Level选择 -->
        <div class="level-selector" id="levelSelector">
            <h2>选择Level</h2>
            <p class="selector-description">学乐深度阅读指导课 - 从Level 1到Level 9，循序渐进提升英语阅读能力</p>
            <div class="levels-grid" id="levelsGrid">
                <!-- Level卡片将通过JavaScript动态加载 -->
            </div>
        </div>

        <!-- 课程列表 -->
        <div class="lessons-content" id="lessonsContent" style="display: none;">
            <div class="lessons-header">
                <button class="back-btn" id="backToLevels" onclick="backToLevels()">← 返回Level选择</button>
                <h2 id="levelTitle">课程列表</h2>
            </div>
            
            <!-- PDF资源下载区域 -->
            <div class="pdf-resources" id="pdfResources" style="display: none;">
                <h3>📚 配套资源下载</h3>
                <div class="pdf-links" id="pdfLinks">
                    <!-- PDF下载链接将通过JavaScript动态加载 -->
                </div>
            </div>
            
            <div class="lessons-list" id="lessonsList">
                <!-- 课程列表将通过JavaScript动态加载 -->
            </div>
        </div>

        <!-- 视频播放器 -->
        <div class="video-player-container" id="videoPlayerContainer" style="display: none;">
            <div class="video-header">
                <button class="back-btn" id="backToLessons" onclick="backToLessons()">← 返回课程列表</button>
                <h2 id="lessonTitle">阅读视频</h2>
            </div>
            <div class="video-wrapper">
                <video id="lessonVideo" controls>
                    您的浏览器不支持视频播放。
                </video>
            </div>
            <div class="video-controls">
                <button class="nav-btn" id="prevLessonBtn" onclick="playPrevLesson()" disabled>← 上一课</button>
                <button class="nav-btn" id="nextLessonBtn" onclick="playNextLesson()" disabled>下一课 →</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/english_reading.js') }}"></script>
</body>
</html>
